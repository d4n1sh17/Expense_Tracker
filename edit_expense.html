<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg-start: #f7f9f2;
            --bg-end: #ebf3fb;
            --ink: #1f2a30;
            --muted: #5f6f79;
            --card: rgba(255, 255, 255, 0.83);
            --line: #d7e1e8;
            --primary: #0f766e;
            --primary-dark: #115e59;
            --secondary: #475569;
            --error-bg: #fde8e8;
            --error-text: #9b1c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 22% 12%, #d8f0ea 0, transparent 38%),
                        radial-gradient(circle at 82% 88%, #fdeac8 0, transparent 35%),
                        linear-gradient(145deg, var(--bg-start), var(--bg-end));
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: min(580px, 100%);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 14px 30px rgba(31, 42, 48, 0.1);
            backdrop-filter: blur(8px);
            animation: fade-slide 0.45s ease;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .subtitle {
            margin: 6px 0 18px;
            color: var(--muted);
            font-size: 0.93rem;
        }

        .alerts {
            margin-bottom: 12px;
            display: grid;
            gap: 7px;
        }

        .alert {
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 0.89rem;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #f8b4b4;
        }

        .form-grid {
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.86rem;
            font-weight: 600;
            color: #33424b;
            letter-spacing: 0.2px;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.93rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6db5af;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            text-decoration: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.92rem;
            font-weight: 600;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--secondary); color: #fff; }

        @keyframes fade-slide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <section class="card">
        <h1>Edit Expense</h1>
        <p class="subtitle">Update the selected record and save changes.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts">
                    {% for category, message in messages %}
                        {% if category == 'error' %}
                            <div class="alert">{{ message }}</div>
                        {% endif %}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense_id) }}">
            <div class="form-grid">
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" maxlength="100" value="{{ form_data.get('title', '') }}" required>
                </div>

                <div>
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        {% for option in ['Food', 'Travel', 'Shopping', 'Bills', 'Health', 'Other'] %}
                            <option value="{{ option }}" {% if form_data.get('category') == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="amount">Amount (INR)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ form_data.get('amount', '') }}" required>
                </div>

                <div>
                    <label for="expense_date">Date</label>
                    <input type="date" id="expense_date" name="expense_date" value="{{ form_data.get('expense_date', '') }}" required>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Update Expense</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </section>
</body>
</html>
